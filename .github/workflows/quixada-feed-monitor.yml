name: quixada_feed_monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "13 * * * *"
      timezone: "America/Sao_Paulo"

permissions:
  contents: read

concurrency:
  group: quixada-feed-monitor
  cancel-in-progress: false

jobs:
  monitor-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restaurar estado do monitor
        id: restore-feed-state
        uses: actions/cache/restore@v4
        with:
          path: .cache/quixada_feed_state.json
          key: quixada-feed-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            quixada-feed-state-${{ github.ref_name }}-
            quixada-feed-state-

      - name: Executar monitor do feed
        id: monitor-feed
        env:
          QUIXADA_FEED_STATE_FILE: .cache/quixada_feed_state.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/monitor_quixada_feed.py

      - name: Salvar estado do monitor
        if: success() && steps.monitor-feed.outputs.state_updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/quixada_feed_state.json
          key: quixada-feed-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
